name: ScreenshotTest
options:
  bundleIdPrefix: com.georgew
  deploymentTarget:
    iOS: '17.0'
targets:
  ScreenshotTest:
    type: application
    platform: iOS
    sources: [ScreenshotTest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgewatts.screenshottest
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
